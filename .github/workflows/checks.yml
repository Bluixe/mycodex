name: checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,documents]" -c requirements-dev.lock
      - run: python -m compileall -q mycodex tests
      - run: python -W error::ResourceWarning -m unittest discover -v > unittest.log 2>&1
      - if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: python -m mycodex.benchmarks --output data/ci-benchmark
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python }}
          path: |
            unittest.log
            data/ci-benchmark/report.json
  sdk-transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev,sdk]" -c requirements-dev.lock
      - run: python -W error::ResourceWarning -m unittest tests.test_runtime_adapters tests.test_sdk_transport_integration -v
