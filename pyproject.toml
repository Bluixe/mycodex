[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mycodex"
version = "0.4.0"
description = "Local Codex project and session manager"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
]

[project.optional-dependencies]
wandb = ["wandb>=0.16"]
dev = ["httpx>=0.28"]
documents = ["pdfplumber>=0.11"]
sdk = ["openai-codex==0.163.0"]

[project.scripts]
mycodex = "mycodex.cli:main"

[tool.setuptools]
packages = ["mycodex"]

[tool.setuptools.package-data]
mycodex = ["templates/*.html", "static/*.css", "static/*.js"]
