[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mycodex"
version = "0.1.0"
description = "Local Codex project and session manager"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mycodex = "mycodex.cli:main"

[tool.setuptools]
packages = ["mycodex"]
